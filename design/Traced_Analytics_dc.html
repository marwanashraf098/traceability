<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Traced Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: Traced app shell (dark sidebar with a collapsible Analytics group, sticky search bar), 12-col card grid; summary first, detail drawers on click. */
:root{
  /* Traced app is light-only: dark sidebar, light canvas, white cards, blue accent */
  color-scheme:light;
  --bg:#f6f6f7; --surface:#ffffff; --surface-2:#f2f3f5; --hover:rgba(37,99,235,.06);
  --ink:#111318; --ink-2:#4b5059; --muted:#868b94; --line:#e7e8eb; --line-2:#d3d5da;
  --accent:#2563eb; --accent-ink:#ffffff; --accent-soft:#e8effd;
  --rail:#15171c; --rail-ink:#c4c7ce; --rail-muted:#7b808a; --rail-hover:#1f2228; --rail-active:#1c2535; --rail-line:#262a31;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --neg:#c3c5ca;
  --o1:#86b6ef; --o2:#5598e7; --o3:#2a78d6; --o4:#1c5cab;
  --q0:#eef4fc; --q1:#cde2fb; --q2:#9ec5f4; --q3:#5598e7; --q4:#256abf; --q5:#184f95;
  --good:#0ca30c; --good-ink:#0a6b2c; --good-soft:#e5f5ea;
  --warn:#fab219; --warn-ink:#8a5300; --warn-soft:#fdf1dc;
  --serious:#ec835a; --serious-ink:#a3401b; --serious-soft:#fbe9e1;
  --crit:#dc2626; --crit-ink:#b91c1c; --crit-soft:#fdeaea;
  --info-ink:#1d4ed8; --info-soft:#e8effd;
  --v2:#6b5fc7; --v2-soft:#eeecfa;
  /* meaning colors: green = kept, blue = start totals, amber = waiting, red = lost, grey = given away */
  --pos:#16a34a; --pos-ink:#15803d; --pos-soft:#e8f6ed;
  --amber:#f59e0b; --amber-ink:#b45309; --amber-soft:#fef4e4;
  --red:#e5484d; --red-ink:#c62a2f; --red-soft:#fdecec;
  --blue:#2a78d6; --blue-ink:#1d4ed8; --blue-soft:#e8f0fb;
  --grey-m:#b4b8c0; --grey-soft:#f0f1f3;
  --shadow:0 1px 2px rgba(17,19,24,.04), 0 0 0 1px var(--line);
  --font-ui:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:"Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:12px;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--font-mono);font-size:12px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}

/* shell: Traced sidebar */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;align-self:start;height:100vh;background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.rail-top{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 16px;border-bottom:1px solid var(--rail-line)}
.wordmark{font-weight:700;font-size:19px;letter-spacing:-.03em;color:#fff;position:relative;padding-right:8px}
.wordmark i{position:absolute;right:0;top:3px;width:5px;height:5px;border-radius:50%;background:#3b82f6}
.menu{all:unset;display:none;cursor:pointer;color:#fff;font-size:13px;font-weight:600;padding:6px 10px;border:1px solid var(--rail-line);border-radius:8px}
.nav{display:flex;flex-direction:column;gap:1px;padding:12px 0;overflow-y:auto;flex:1}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:9px 18px;color:var(--rail-ink);font-weight:500;font-size:14px;position:relative}
.nav button svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{background:var(--rail-hover);color:#fff}
.nav button:focus-visible{outline:2px solid #3b82f6;outline-offset:-2px}
.nav .grp{color:#fff}
.nav .grp .chev{margin-left:auto;width:14px;height:14px;transition:transform .15s}
.nav .grp[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.nav .new{margin-left:6px;font-size:10px;font-weight:700;letter-spacing:.04em;color:#93b4ff;background:rgba(59,130,246,.18);padding:2px 6px;border-radius:4px}
.nav .grp + .sub{display:flex;flex-direction:column;gap:1px;padding:2px 0 6px}
.nav .grp[aria-expanded="false"] + .sub{display:none}
.nav .sub button{padding:7px 18px 7px 47px;font-size:13.5px;color:var(--rail-ink)}
.nav .sub button::before{content:"";position:absolute;left:26px;top:0;bottom:0;width:1px;background:var(--rail-line)}
.nav .sub button[aria-current="page"]{background:var(--rail-active);color:#fff;box-shadow:inset 3px 0 0 #3b82f6}
.nav .sub button[aria-current="page"]::before{background:#3b82f6}
.navlabel{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--rail-muted);padding:14px 18px 6px;margin-top:8px;border-top:1px solid var(--rail-line)}
.rail-user{display:flex;align-items:center;gap:10px;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rail-line)}
.rail-user b{display:block;color:#fff;font-weight:500;font-size:13px}
.rail-user small{color:var(--rail-muted);font-size:12px}
.av{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block}

.topbar{position:sticky;top:0;z-index:6;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 24px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.search{display:flex;align-items:center;gap:8px;width:340px;max-width:100%;min-width:0;height:34px;padding:0 8px 0 12px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);color:var(--muted);font-size:13px;cursor:text}
.search svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;flex:none}
.search span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search kbd{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line-2);border-radius:5px;padding:1px 5px;color:var(--muted);background:var(--surface-2)}
.topbar .spacer{flex:1}
.bell{all:unset;cursor:pointer;position:relative;width:32px;height:32px;display:grid;place-items:center;color:var(--ink-2)}
.bell svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}
.bell b{position:absolute;top:2px;right:1px;background:var(--crit);color:#fff;font-size:9.5px;font-weight:700;border-radius:8px;padding:0 4px;line-height:14px}
.page{padding-inline:32px;padding-block:28px 56px}
.phead{display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px 24px;margin-bottom:14px}
.phead > div:first-child{min-width:0;flex:1}
.crumb{font-size:12.5px;color:var(--muted);font-weight:500;margin-bottom:2px}
.phead h1{margin:0;font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1.1;text-wrap:balance}
.phead .sub{color:var(--ink-2);font-size:14px;margin-top:6px}
.dates{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.dates button{all:unset;cursor:pointer;padding:6px 11px;border-radius:7px;font-size:13px;color:var(--ink-2);font-weight:500}
.dates button:hover{color:var(--ink)}
.dates button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(17,19,24,.08),0 0 0 1px var(--line)}
.dates button:focus-visible{outline:2px solid var(--accent)}
.subbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:20px}
.subbar .spacer{flex:1}
main{min-width:0}
.tb-left{min-width:0;margin-right:auto}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.select,.seg,.btn{height:34px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px}
.select{padding:0 30px 0 10px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 15px,calc(100% - 10px) 15px;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
.seg{display:inline-flex;padding:2px;gap:2px}
.seg button{all:unset;cursor:pointer;padding:0 10px;border-radius:6px;font-size:13px;font-weight:500;color:var(--ink-2);display:flex;align-items:center}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:focus-visible{outline:2px solid var(--accent)}
.btn{padding:0 12px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:var(--r);background:var(--surface);border:1px dashed var(--line-2);color:var(--ink-2);font-size:13px;margin-bottom:22px}
.banner b{color:var(--ink)}

/* grid & cards */
.tab[hidden]{display:none!important}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}.s3{grid-column:span 3}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 18px 16px;min-width:0;display:flex;flex-direction:column;gap:14px}
.card-h{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.card-h > div{min-width:0;flex:1}
.card h3{margin:0;font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.card .desc{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:5px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.chip.v2{background:var(--v2-soft);color:var(--v2)}
.chip.src{background:var(--surface-2);color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500}
.section-title{grid-column:span 12;display:flex;align-items:baseline;gap:10px;margin-top:10px}
.section-title h2{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.section-title::after{content:"";flex:1;height:1px;background:var(--line)}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;grid-column:span 12}
.kpi{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .lbl{font-size:12.5px;color:var(--ink-2);display:flex;gap:6px;align-items:center;justify-content:space-between}
.kpi .val{overflow-wrap:anywhere;font-family:var(--font-mono);font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.kpi .foot{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.delta{font-weight:600;font-size:12px}
.delta.up{color:var(--good-ink)} .delta.down{color:var(--crit-ink)} .delta.flat{color:var(--muted)}
.kpi.click{cursor:pointer} .kpi.click:hover{box-shadow:var(--shadow),0 0 0 1px var(--accent)}

/* cash pipeline */
.pipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;grid-column:span 12;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.stage{padding:16px 18px 16px 22px;position:relative;display:flex;flex-direction:column;gap:6px;min-width:0}
.stage + .stage{border-left:1px solid var(--line)}
.stage + .stage::before{content:"";position:absolute;left:-7px;top:50%;width:12px;height:12px;background:var(--surface);border-top:1px solid var(--line);border-right:1px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.stage .step{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.stage .amt{font-family:var(--font-mono);font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.stage .amt small{font-size:13px;color:var(--muted);font-weight:500;margin-right:4px}
.stage .meta{font-size:12.5px;color:var(--ink-2)}
.stage .calc{font-size:12px;color:var(--muted)}
.stage .amt{color:var(--amber-ink)}
.stage.bank{background:var(--pos-soft)}
.stage.bank .step{color:var(--pos-ink)}
.stage.bank .amt{color:var(--pos-ink);font-size:28px}
.stage.bank + .stage::before{background:var(--pos-soft)}
.bar-track{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.bar-track i{display:block;height:100%;border-radius:3px;background:var(--amber)}

/* alerts */
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{all:unset;cursor:pointer;display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 12px;border-radius:8px;background:var(--surface-2)}
.alert:hover{background:var(--hover)}
.alert:focus-visible{outline:2px solid var(--accent)}
.alert .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:12px}
.alert.crit .ic{background:var(--crit-soft);color:var(--crit-ink)}
.alert.warn .ic{background:var(--warn-soft);color:var(--warn-ink)}
.alert.info .ic{background:var(--info-soft);color:var(--info-ink)}
.alert b{display:block;font-weight:600;font-size:13.5px}
.alert span{color:var(--muted);font-size:12.5px}
.alert .go{color:var(--accent);font-size:12.5px;font-weight:600;white-space:nowrap;align-self:center}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;white-space:nowrap}
.pill i{font-style:normal;font-size:11px}
.pill.good{background:var(--good-soft);color:var(--good-ink)}
.pill.warn{background:var(--warn-soft);color:var(--warn-ink)}
.pill.serious{background:var(--serious-soft);color:var(--serious-ink)}
.pill.crit{background:var(--crit-soft);color:var(--crit-ink)}
.pill.info{background:var(--info-soft);color:var(--info-ink)}
.pill.neutral{background:var(--surface-2);color:var(--ink-2)}

/* charts */
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.legend i.sq{width:10px;height:10px;border-radius:3px}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{fill:var(--muted);font-size:11px;font-family:var(--font-ui)}
svg.chart text.val{fill:var(--ink-2);font-weight:600}
svg.chart .grid line{stroke:var(--line);stroke-width:1}
svg.chart .base{stroke:var(--line-2);stroke-width:1}
svg.chart .hit{fill:transparent;cursor:crosshair}
svg.chart .hit:hover{fill:var(--hover)}
.hbars{display:flex;flex-direction:column;gap:9px}
.hbar{display:grid;grid-template-columns:minmax(90px,30%) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.hbar .l{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.hbar .t{height:12px;position:relative}
.hbar .t i{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--s1);min-width:2px}
.hbar .v{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;display:flex;gap:8px;align-items:center;justify-content:flex-end}
.hbar[data-tip]{cursor:default}
.hbar[data-tip]:hover .l{color:var(--ink)}
.funnel{display:flex;flex-direction:column;gap:6px}
.fstep{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:center}
.fstep .l{font-size:13px;color:var(--ink-2)}
.frow{display:flex;align-items:center;gap:10px;min-width:0}
.frow span{font-weight:600;font-size:13px;white-space:nowrap;color:var(--ink-2);font-variant-numeric:tabular-nums}
.fstep .bar{height:24px;border-radius:0 4px 4px 0;flex:none}
.fconv{margin-left:122px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.fconv b{color:var(--ink-2)}
.cols{display:flex;align-items:flex-end;gap:14px;height:170px;padding-top:18px;border-bottom:1px solid var(--line-2)}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.cols .c i{width:min(46px,100%);background:var(--s1);border-radius:4px 4px 0 0;display:block}
.cols .c b{font-size:12px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.cols-l{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.cols-l span{flex:1;text-align:center}
.split{display:flex;height:14px;border-radius:4px;overflow:hidden;gap:2px}
.split i{display:block;height:100%}
.heat{display:grid;grid-template-columns:34px repeat(24,minmax(14px,1fr));gap:2px;font-size:10.5px;color:var(--muted);min-width:520px}
.heat i{aspect-ratio:1.4;border-radius:2px;display:block}
.heat span{display:flex;align-items:center}
.scale{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.scale i{width:18px;height:10px;border-radius:2px;display:inline-block}

/* tables */
.tw{overflow-x:auto;margin-inline:-18px;padding-inline:18px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:0 10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th:first-child,td:first-child{padding-left:0} th:last-child,td:last-child{padding-right:0}
td.r,th.r{text-align:right}
td.r{font-variant-numeric:tabular-nums}
tfoot td{border-bottom:0;border-top:1px solid var(--line-2)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--hover)}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--ink)}
th.sort[aria-sort] {color:var(--ink)}
.cell-main{font-weight:500}
.cell-sub{color:var(--muted);font-size:12px}
.spark{width:72px;height:22px;display:block}
.abc{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-weight:700;font-size:12px;background:var(--surface-2);color:var(--ink-2)}
.abc.A{background:var(--accent-soft);color:var(--accent)}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fchip{all:unset;cursor:pointer;height:28px;padding:0 11px;border-radius:14px;border:1px solid var(--line-2);font-size:12.5px;font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.fchip b{font-weight:600;color:var(--muted);font-size:11.5px}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fchip[aria-pressed="true"] b{color:var(--bg);opacity:.7}
.fchip:focus-visible{outline:2px solid var(--accent)}
.search{height:32px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:0 10px;min-width:0;width:220px;max-width:100%}

.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.mini{display:flex;flex-direction:column;gap:2px}
.mini .lbl{font-size:12px;color:var(--muted)}
.mini .val{font-size:18px;font-weight:600;letter-spacing:-.01em}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.li:last-child{border-bottom:0}

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const fmtN = n => Math.round(n).toLocaleString('en-US');
const egp = n => 'EGP ' + fmtN(n);
const egpK = n => { const a = Math.abs(n); const s = n < 0 ? '−' : ''; return a >= 1e6 ? s+'EGP '+(a/1e6).toFixed(2)+'M' : a >= 1e4 ? s+'EGP '+Math.round(a/1e3)+'k' : s+'EGP '+fmtN(a); };
const axK = n => n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? Math.round(n/1e3)+'k' : String(Math.round(n));
const pct = (n, d=1) => n.toFixed(d) + '%';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function niceMax(m){ const p = Math.pow(10, Math.floor(Math.log10(m))); for (const s of [1,1.2,1.5,2,2.5,3,4,5,6,8,10]) if (s*p >= m) return s*p; return 10*p; }
function normalize(rows, key, total){ const s = rows.reduce((a,r)=>a+r[key],0); rows.forEach(r => r[key] = r[key]*total/s); return rows; }
const state = { mode:'real', v2:true, tab:'overview', orderFilter:'All', orderQ:'', skuSort:{k:'rev',d:-1} };
const rv = r => state.mode === 'real' ? r.real : r.booked;
const modeLbl = () => state.mode === 'real' ? 'realized' : 'booked';

function card(title, body, o={}){
  return `<article class="card ${o.span||'s6'} ${o.v2?'v2only':''}" ${o.id?`id="${o.id}"`:''}>
    <div class="card-h"><div><h3>${title}</h3>${o.desc?`<p class="desc">${o.desc}</p>`:''}</div>${o.v2?'<span class="chip v2">V2</span>':''}${o.right||''}</div>
    ${body}</article>`;
}
const KI = {
  cash:'<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>', bag:'<path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 016 0"/>',
  tag:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.2"/>', truck:'<path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/>',
  receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>', clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  chart:'<path d="M4 20h16"/><path d="M7 16v-5M12 16V7M17 16v-8"/>', percent:'<path d="M5 19L19 5"/><circle cx="7" cy="7" r="2"/><circle cx="17" cy="17" r="2"/>',
  box:'<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12L4 7.5M12 12v9"/>', star:'<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.8 6.8 19.6l1-5.8L3.5 9.7l5.9-.9z"/>',
  alert:'<path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17.5v.01"/>', repeat:'<path d="M4 9h13l-3-3M20 15H7l3 3"/>', users:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c.7-3.4 3-5.2 6-5.2s5.3 1.8 6 5.2"/><path d="M16 5a3.2 3.2 0 010 6.3M18 14.6c1.7.7 2.7 2.4 3 5"/>'};
const KTONE = {
  'Net revenue':['good','cash'], 'Orders':['blue','bag'], 'Average order value':['blue','tag'], 'Delivery success rate':['good','truck'], 'Bosta cost per delivery':['grey','receipt'], 'Payout lag':['warn','clock'],
  'Gross sales':['blue','chart'], 'Booked revenue':['blue','bag'], 'Net realized revenue':['good','cash'], 'Realized ÷ booked':['good','percent'], 'Gross margin':['good','percent'],
  'Active SKUs':['blue','box'], 'Units sold':['blue','box'], 'Best SKU by true net':['good','star'], 'SKUs losing money':['bad','alert'],
  'Pieces in warehouse':['blue','box'], 'Stock value at cost':['warn','cash'], 'Average days in stock':['warn','clock'], 'Pieces moved 4+ times':['bad','repeat'],
  'Failed deliveries':['bad','alert'], 'Order → handed to Bosta':['blue','clock'], 'Handed to Bosta → delivered':['blue','truck'],
  'Shipping fees':['grey','truck'], 'Failed, exchange and return shipping':['bad','repeat'], 'Other Bosta fees':['grey','receipt'], 'Cost per successful delivery':['grey','receipt'], 'Cost per unsuccessful delivery':['bad','alert'], 'Contribution profit':['good','cash'],
  'Customers who ordered':['blue','users'], 'Repeat purchase rate':['good','repeat'], 'Days between orders':['blue','clock'], 'Revenue from returning customers':['good','users'],
  'Realized revenue':['good','cash'], 'Stock left':['blue','box'], 'Returns · exchanges':['bad','repeat'], 'Failed delivery':['bad','alert'],
  'Cost per failed delivery':['bad','alert'], 'Total cost':['bad','receipt'], 'Sales lost':['bad','alert'], 'Total extra shipping':['bad','repeat'], 'Exchanges':['bad','repeat'], 'Returns':['bad','repeat'], 'True net':['good','cash']};
function kpi(lbl, val, foot='', o={}){
  const key = Object.keys(KTONE).find(k => lbl === k || lbl.startsWith(k+' ('));
  const [tone, ic] = o.tone ? [o.tone, o.ic || (KTONE[key]||[])[1] || 'chart'] : (KTONE[key] || ['grey','chart']);
  return `<div class="kpi t-${tone} ${o.hero?'hero':''} ${o.click||o.drill?'click':''} ${o.v2?'v2only':''}" ${o.click?`data-go="${o.click}" tabindex="0" role="button"`:''} ${o.drill?`data-drill="${o.drill}" tabindex="0" role="button"`:''} ${o.tip?`data-tip="${esc(o.tip)}"`:''}>
    <div class="lbl"><span class="lt"><span class="kt ${tone}" aria-hidden="true"><svg viewBox="0 0 24 24">${KI[ic]||KI.chart}</svg></span><span>${lbl}</span></span>${o.v2?'<span class="chip v2">V2</span>':''}</div><div class="val">${val}</div><div class="foot">${foot}</div></div>`;
}
const delta = (txt, dir) => `<span class="delta ${dir}">${dir==='up'?'▲':dir==='down'?'▼':'–'} ${txt}</span>`;
const sec = t => `<div class="section-title"><h2>${t}</h2></div>`;
function pill(kind, txt){ const ic = {good:'✓',warn:'!',serious:'↺',crit:'✕',info:'◷',neutral:'→'}[kind]; return `<span class="pill ${kind}"><i>${ic}</i>${txt}</span>`; }
function ratePill(r, warnAt=78, critAt=68){ const k = r < critAt ? 'crit' : r < warnAt ? 'warn' : 'good'; return pill(k, pct(r)); }

function hbars(rows, o={}){
  const max = o.max || Math.max(...rows.map(r=>r.v));
  return `<div class="hbars">${rows.map(r => `<div class="hbar" ${r.tip?`data-tip="${esc(r.tip)}"`:''}>
    <span class="l" title="${esc(r.l)}">${r.l}</span><span class="t"><i style="width:${Math.max(.5, r.v/max*100)}%;${(r.c||o.color)?`background:${r.c||o.color}`:''}"></i></span>
    <span class="v">${r.d}${r.x||''}</span></div>`).join('')}</div>`;
}

function lineChart({labels, series, fmtY=axK, H=230, every=5}){
  const W=640, L=50, R=14, T=12, B=26, n=labels.length;
  const max = niceMax(Math.max(...series.flatMap(s=>s.values)) * 1.04);
  const x = i => L + (W-L-R) * i/(n-1), y = v => T + (H-T-B) * (1 - v/max);
  let g = '<g class="grid">';
  for (let t=0;t<=4;t++){ const v=max*t/4; g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${fmtY(v)}</text>`; }
  g += '</g>';
  let xl = labels.map((l,i) => (i % every === 0 || i === n-1) ? `<text x="${x(i)}" y="${H-6}" text-anchor="middle">${l}</text>` : '').join('');
  let paths = series.map(s => {
    const d = s.values.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
    const area = s.area ? `<path d="${d}L${x(n-1)},${y(0)}L${x(0)},${y(0)}Z" style="fill:${s.color};opacity:.1"/>` : '';
    const last = s.values[n-1];
    return `${area}<path d="${d}" style="fill:none;stroke:${s.color};stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/>
      <circle cx="${x(n-1)}" cy="${y(last)}" r="4.5" style="fill:${s.color};stroke:var(--surface);stroke-width:2"/>`;
  }).join('');
  const bw = (W-L-R)/(n-1);
  const hits = labels.map((l,i)=>`<rect class="hit" x="${x(i)-bw/2}" y="${T}" width="${bw}" height="${H-T-B}" data-tip="${esc(l+'\n'+series.map(s=>s.name+': '+(s.fmt||egp)(s.values[i])).join('\n'))}"/>`).join('');
  const leg = series.length > 1 ? `<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${s.name}</span>`).join('')}</div>` : '';
  return `${leg}<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.map(s=>s.name).join(', '))} over time">${g}<line class="base" x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}"/>${paths}${xl}${hits}</svg>`;
}

function waterfall(steps){
  const W=640, H=250, L=8, R=8, T=26, B=40, n=steps.length;
  let run=0; const bars = steps.map(s => { if (s.total){ const b={...s, from:0, to:s.v}; run=s.v; return b; } const b={...s, from:run+s.v, to:run}; run+=s.v; return b; });
  const max = niceMax(Math.max(...bars.map(b=>Math.max(b.from,b.to))));
  const slot=(W-L-R)/n, bw=Math.min(56, slot*.62);
  const y = v => T + (H-T-B)*(1-v/max);
  let out = '';
  bars.forEach((b,i)=>{
    const cx = L + slot*i + slot/2, top=y(Math.max(b.from,b.to)), h=Math.max(2, Math.abs(y(b.from)-y(b.to)));
    const col = b.col || (b.total ? 'var(--blue)' : 'var(--grey-m)');
    if (b.hero) out += `<rect x="${cx-slot/2+4}" y="${T-22}" width="${slot-8}" height="${H-T-B+22+36}" rx="8" style="fill:var(--pos-soft)"/>`;
    out += `<rect x="${cx-bw/2}" y="${top}" width="${bw}" height="${h}" rx="3" style="fill:${col}"/>`;
    if (i < n-1) { const yy = y(b.total ? b.to : b.from); out += `<line x1="${cx+bw/2}" x2="${cx+slot-bw/2}" y1="${yy}" y2="${yy}" style="stroke:var(--line-2);stroke-width:1"/>`; }
    out += `<text class="val" x="${cx}" y="${top-7}" text-anchor="middle" style="${b.hero?'fill:var(--pos-ink);font-size:13px;font-weight:700':''}">${b.total?'':'−'}${axK(Math.abs(b.v))}</text>`;
    const words = b.l.split(' '); const l1 = words.slice(0, Math.ceil(words.length/2)).join(' '), l2 = words.slice(Math.ceil(words.length/2)).join(' ');
    const ls = b.hero ? ' style="fill:var(--pos-ink);font-weight:700"' : '';
    out += `<text x="${cx}" y="${H-B+16}" text-anchor="middle"${ls}>${l1}</text><text x="${cx}" y="${H-B+30}" text-anchor="middle"${ls}>${l2}</text>`;
    out += `<rect class="hit" x="${cx-slot/2}" y="${T-20}" width="${slot}" height="${H-T-B+20}" data-tip="${esc(b.l+'\n'+(b.total?'':'−')+egp(Math.abs(b.v))+(b.note?'\n'+b.note:''))}"/>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Revenue waterfall"><line class="base" x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}"/>${out}</svg>`;
}

function spark(vals, color='var(--s1)'){
  const W=72,H=22,mx=Math.max(...vals),mn=Math.min(...vals),n=vals.length;
  const pts = vals.map((v,i)=>`${(i/(n-1)*(W-4)+2).toFixed(1)},${(H-3-(v-mn)/((mx-mn)||1)*(H-6)).toFixed(1)}`);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${pts.join(' ')}" style="fill:none;stroke:${color};stroke-width:1.6;stroke-linejoin:round"/><circle cx="${pts[n-1].split(',')[0]}" cy="${pts[n-1].split(',')[1]}" r="2.4" style="fill:${color}"/></svg>`;
}
function seeded(i){ const x = Math.sin(i*12.9898)*43758.5453; return x - Math.floor(x); }

/* ---------- sample data ---------- */
const T = { orders:1390, unfulfilled:88, transit:182, failed:168, delivered:952, paidOrders:781, aov:1150,
  booked:1598500, discounts:92400, returns:61300, paid:898150, awaiting:196650, transitVal:209300, unfulVal:101200, failedVal:193200,
  success:85.0, wRate:83.4, ship:78120, failCost:13245, other:16072, cogs:392700 };
T.realized = T.delivered*T.aov - T.returns; // 1,033,500
T.bosta = T.ship + T.failCost + T.other;

/* ---------- REVENUE ---------- */
function rRevenue(){
  const wf = waterfall([
    {l:'Gross sales', v:T.booked+T.discounts, total:true, col:'var(--blue)', note:'All orders, before discounts'},
    {l:'Discounts', v:-T.discounts, col:'var(--grey-m)', note:'5 discount codes · money you chose to give away'},
    {l:'Still in pipeline', v:-(T.transitVal+T.unfulVal), col:'var(--amber)', note:'In transit + not yet fulfilled · not here yet'},
    {l:'Failed deliveries', v:-T.failedVal, col:'var(--red)', note:`${T.failed} orders refused or undeliverable · lost`},
    {l:'Returns & refunds', v:-T.returns, col:'var(--red)', note:'52 orders · lost'},
    {l:'Net realized', v:T.realized, total:true, hero:true, col:'var(--pos)', note:'Delivered and kept'}]) + `<div class="wlegend"><span><i style="background:var(--blue)"></i>Starting total</span><span><i style="background:var(--grey-m)"></i>Given away</span><span><i style="background:var(--amber)"></i>Not here yet</span><span><i style="background:var(--red)"></i>Lost</span><span><i style="background:var(--pos)"></i>Kept</span></div>`;
  const fun = [['Ordered',T.orders,T.booked],['Fulfilled',T.orders-T.unfulfilled,T.booked-T.unfulVal],['Delivered',T.delivered,T.delivered*T.aov],['Paid to you',T.paidOrders,T.paid]];
  const fcol = ['var(--o1)','var(--o2)','var(--o3)','var(--pos)'];
  const funnel = `<div class="funnel">${fun.map((f,i)=> (i?`<div class="fconv">↓ <b>${pct(f[1]/fun[i-1][1]*100)}</b> of orders continue</div>`:'') + `<div class="fstep"><span class="l">${f[0]}</span><div class="frow" data-tip="${esc(f[0]+'\n'+fmtN(f[1])+' orders\n'+egp(f[2]))}"><div class="bar" style="width:${f[2]/fun[0][2]*68}%;background:${fcol[i]}"></div><span>${egpK(f[2])} · ${fmtN(f[1])}</span></div></div>`).join('')}</div>`;

  const byRows = (arr, extra) => hbars([...arr].sort((a,b)=>rv(b)-rv(a)).map(r => ({l:r.l, v:rv(r), d:egpK(rv(r)), x:extra?extra(r):'', tip:`${r.l}\nBooked ${egp(r.booked)}\nRealized ${egp(r.real)}`+(r.s?`\nDelivery success ${pct(r.s)}`:'')})));
  const codeRows = codes.map(c => `<tr><td class="mono">${c.c}</td><td class="r">${c.o}</td><td class="r">${egp(c.rev)}</td><td class="r">${egp(c.cost)}</td><td class="r">${ratePill(c.s)}</td><td class="r">${(c.rev/c.cost).toFixed(1)}×</td></tr>`).join('');

  const hours = Array.from({length:24},(_,h)=>h);
  const dows = ['Sat','Sun','Mon','Tue','Wed','Thu','Fri'];
  const heatV = (d,h) => { const ev = Math.exp(-Math.pow((h-21.5)/3.2,2)) + .45*Math.exp(-Math.pow((h-14)/3,2)) + .05; const dw = [1,.85,.8,.82,.9,1.15,1.25][d]; return ev*dw*(.85+seeded(d*24+h)*.3); };
  const hmax = Math.max(...dows.flatMap((_,d)=>hours.map(h=>heatV(d,h))));
  const qcol = v => { const r=v/hmax; return r<.12?'var(--q0)':r<.3?'var(--q1)':r<.5?'var(--q2)':r<.7?'var(--q3)':r<.88?'var(--q4)':'var(--q5)'; };

/* failed / exchange / return drill-down */
const FAIL_FEE = 105, EXCH_FEE = 60, RET_FEE = 45, RTO_FEE = 45, OUT_FEE = 60;
const TOT = {failed:T.failed, exchange:64, ret:41};
const DRILL_SKUS = (() => {
  const raw = SKUS.map(s => ({s, f:s.sold*s.fail/100, e:s.sold*s.exch/100, r:s.sold*s.ret/100*(1-s.fail/100)}));
  const sf = raw.reduce((a,x)=>a+x.f,0), se = raw.reduce((a,x)=>a+x.e,0), sr = raw.reduce((a,x)=>a+x.r,0);
  const rows = raw.map(x => ({sku:x.s.sku, name:x.s.name, v:x.s.v, sold:x.s.sold, failRate:x.s.fail,
    f:Math.round(x.f/sf*TOT.failed*.88), e:Math.round(x.e/se*TOT.exchange*.85), r:Math.round(x.r/sr*TOT.ret*.85),
    reason: x.s.fail>18 ? 'Phone unreachable' : x.s.exch>14 ? 'Customer refused (size)' : 'Customer refused'}));
  const o = {sku:'', name:'Other 72 SKUs', v:'', sold:0, failRate:null, reason:'Mixed',
    f:TOT.failed-rows.reduce((a,x)=>a+x.f,0), e:TOT.exchange-rows.reduce((a,x)=>a+x.e,0), r:TOT.ret-rows.reduce((a,x)=>a+x.r,0)};
  return [...rows, o];
})();
const SHIPS = (() => {
  const reasons = {failed:['Customer refused','Phone unreachable','Wrong address','Rescheduled 3 times'], exchange:['Size too small','Size too big','Wrong color'], ret:['Not as pictured','Quality issue','Changed mind']};
  const gs = ['Cairo','Giza','Alexandria','Qalyubia','Dakahlia','Sharqia','Assiut','Sohag','Monufia','Beheira'];
  const types = [...Array(18).fill('failed'), ...Array(7).fill('exchange'), ...Array(5).fill('ret')];
  return types.map((type,i) => {
    const s = SKUS[Math.floor(seeded(i*7+3)*9)];
    const d = new Date(2026, 8, 8 + Math.floor(seeded(i*5+1)*27));
    return {awb: String(7000 + Math.floor(seeded(i+11)*1999)) + ' ' + String(1000 + Math.floor(seeded(i+29)*8999)), order:'#' + (4400 + Math.floor(seeded(i+5)*460)),
      sku:s.sku, item:`${s.name} · ${s.v}`, gov: gs[Math.floor(seeded(i*3+2)*gs.length)], type,
      reason: reasons[type][Math.floor(seeded(i*13+4)*reasons[type].length)],
      out: OUT_FEE, back: type==='failed' ? RTO_FEE : type==='exchange' ? EXCH_FEE : RET_FEE,
      date: d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}), t:d.getTime()};
  }).sort((a,b)=>b.t-a.t);
})();
const TYPE_LBL = {failed:'Failed delivery', exchange:'Exchange', ret:'Return'};
const TYPE_PILL = {failed:'crit', exchange:'warn', ret:'serious'};
let drillState = {kind:'extra', view:'sku'};
function drillDrawer(kind, view){
  drillState = {kind, view: view || drillState.view || 'sku'};
  const failedOnly = kind === 'failed';
  const title = failedOnly ? 'Cost per unsuccessful delivery' : 'Failed, exchange and return shipping';
  const sub = failedOnly
    ? `Each failed order costs the outbound fee (EGP ${OUT_FEE}) plus the return-to-origin fee (EGP ${RTO_FEE}) and brings in nothing.`
    : 'Extra shipping paid on orders that came back. Outbound fees are counted in shipping fees.';
  const extraOf = r => r.f*RTO_FEE + r.e*EXCH_FEE + r.r*RET_FEE;
  const kpis = failedOnly
    ? `${kpi('Cost per failed delivery', egp(FAIL_FEE), 'outbound + return fee')}${kpi('Failed deliveries', fmtN(T.failed), pct(100-T.success)+' of attempts')}${kpi('Total cost', egp(T.failed*FAIL_FEE), 'last 30 days')}${kpi('Sales lost', egpK(T.failedVal), 'order value not delivered')}`
    : `${kpi('Total extra shipping', egp(T.failCost), `${TOT.failed+TOT.exchange+TOT.ret} shipments`)}${kpi('Failed deliveries', egp(TOT.failed*RTO_FEE), `${TOT.failed} × EGP ${RTO_FEE} return fee`)}${kpi('Exchanges', egp(TOT.exchange*EXCH_FEE), `${TOT.exchange} × EGP ${EXCH_FEE}`)}${kpi('Returns', egp(TOT.ret*RET_FEE), `${TOT.ret} × EGP ${RET_FEE}`)}`;
  const tabs = `<div class="dtabs" role="group" aria-label="Group by"><button data-dview="sku" aria-pressed="${drillState.view==='sku'}">By SKU</button><button data-dview="awb" aria-pressed="${drillState.view==='awb'}">By shipment (AWB)</button></div>`;
  let table;
  if (drillState.view === 'sku') {
    const rows = [...DRILL_SKUS].filter(r => failedOnly ? r.f>0 : (r.f+r.e+r.r)>0).sort((a,b)=> (b.sku?1:0)-(a.sku?1:0) || (failedOnly ? b.f-a.f : extraOf(b)-extraOf(a)));
    table = failedOnly
      ? `<table><thead><tr><th>SKU</th><th class="r">Failed</th><th class="r">Failure rate</th><th class="r">Cost</th><th>Top reason</th></tr></thead><tbody>${rows.map(r=>`<tr ${r.sku?`class="click" data-sku="${r.sku}"`:''}><td><div class="cell-main">${r.name}${r.v?` <span class="muted">· ${r.v}</span>`:''}</div>${r.sku?`<div class="cell-sub mono">${r.sku}</div>`:''}</td><td class="r">${r.f}</td><td class="r">${r.failRate==null?'–':r.failRate>=20?pill('crit',pct(r.failRate)):r.failRate>=15?pill('warn',pct(r.failRate)):pct(r.failRate)}</td><td class="r">${egp(r.f*FAIL_FEE)}</td><td>${r.reason}</td></tr>`).join('')}</tbody><tfoot><tr><td><b>Total</b></td><td class="r"><b>${T.failed}</b></td><td class="r">${pct(100-T.success)}</td><td class="r"><b>${egp(T.failed*FAIL_FEE)}</b></td><td></td></tr></tfoot></table>`
      : `<table><thead><tr><th>SKU</th><th class="r">Failed</th><th class="r">Exchanges</th><th class="r">Returns</th><th class="r">Extra shipping</th></tr></thead><tbody>${rows.map(r=>`<tr ${r.sku?`class="click" data-sku="${r.sku}"`:''}><td><div class="cell-main">${r.name}${r.v?` <span class="muted">· ${r.v}</span>`:''}</div>${r.sku?`<div class="cell-sub mono">${r.sku}</div>`:''}</td><td class="r">${r.f}</td><td class="r">${r.e}</td><td class="r">${r.r}</td><td class="r">${egp(extraOf(r))}</td></tr>`).join('')}</tbody><tfoot><tr><td><b>Total</b></td><td class="r"><b>${TOT.failed}</b></td><td class="r"><b>${TOT.exchange}</b></td><td class="r"><b>${TOT.ret}</b></td><td class="r"><b>${egp(T.failCost)}</b></td></tr></tfoot></table>`;
  } else {
    const ships = SHIPS.filter(x => !failedOnly || x.type==='failed');
    const total = failedOnly ? T.failed : TOT.failed+TOT.exchange+TOT.ret;
    table = `<table><thead><tr><th>AWB</th><th>Order</th><th>SKU</th><th>Governorate</th>${failedOnly?'':'<th>Type</th>'}<th>Reason</th><th class="r">${failedOnly?'Out + back':'Fee'}</th><th>Date</th></tr></thead><tbody>${ships.map(x=>`<tr class="click" data-sku="${x.sku}"><td class="mono">${x.awb}</td><td>${x.order}</td><td><div class="cell-main">${x.item}</div></td><td>${x.gov}</td>${failedOnly?'':`<td>${pill(TYPE_PILL[x.type],TYPE_LBL[x.type])}</td>`}<td>${x.reason}</td><td class="r">${failedOnly?egp(x.out+x.back):egp(x.back)}</td><td>${x.date}</td></tr>`).join('')}</tbody></table>
      <p class="note">Showing the ${ships.length} most recent of ${total} shipments. In the app this list pages through all of them and exports to CSV.</p>`;
  }
  const byType = failedOnly ? '' : `<div class="card s12"><div class="card-h"><div><h3>By type</h3></div></div>${hbars([
      {l:'Failed delivery (return fee)', v:TOT.failed*RTO_FEE, d:egp(TOT.failed*RTO_FEE), tip:`${TOT.failed} shipments × EGP ${RTO_FEE}`},
      {l:'Exchange shipping', v:TOT.exchange*EXCH_FEE, d:egp(TOT.exchange*EXCH_FEE), tip:`${TOT.exchange} shipments × EGP ${EXCH_FEE}`},
      {l:'Return shipping', v:TOT.ret*RET_FEE, d:egp(TOT.ret*RET_FEE), tip:`${TOT.ret} shipments × EGP ${RET_FEE}`}], {color:'var(--red)'})}</div>`;
  const byReason = failedOnly ? `<div class="card s12"><div class="card-h"><div><h3>Cost by failure reason</h3></div></div>${hbars([['Customer refused',41],['Phone unreachable',27],['Wrong or incomplete address',13],['Rescheduled too many times',11],['Damaged or other',8]].map(([l,v])=>{ const n=Math.round(v/100*T.failed); return {l, v:n*FAIL_FEE, d:egp(n*FAIL_FEE), tip:`${l}\n${n} failed orders`}; }), {color:'var(--red)'})}</div>` : '';
  openDrawer(`<div class="drawer-h"><div><h2>${title}</h2><p class="desc muted" style="margin:2px 0 0">${sub}</p></div><button class="x" aria-label="Close">✕</button></div>
    <div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">${kpis}</div>
    ${byType}${byReason}
    <div class="card s12"><div class="card-h"><div><h3>${drillState.view==='sku'?'By SKU':'By shipment'}</h3><p class="desc">Click a row to open the SKU.</p></div>${tabs}</div><div class="tw">${table}</div></div>`);
  $('#drawer').classList.add('wide');
}
function piecesDrawer(){
  const pieces = [['WLC-OLV-32-0042','Wide-Leg Cargo · Olive / 32',6,'Failed ×3, exchange ×2','In stock'],['TRK-BLK-M-0018','Track Pants · Black / M',5,'Failed ×4','In transit'],['DNJ-IND-L-0007','Denim Jacket · Indigo / L',5,'Return ×2, failed ×2','In stock'],
    ['KNP-NVY-L-0031','Knit Polo · Navy / L',4,'Exchange ×2, failed ×1','In stock'],['LNS-SND-M-0056','Linen Shirt · Sand / M',4,'Return ×1, failed ×2','In stock'],['HWH-GRY-L-0090','Heavyweight Hoodie · Grey / L',4,'Failed ×3','Returning']];

/* ---------- render & events ---------- */
function renderAll(){ rOverview(); rRevenue(); rProducts(); rInventory(); rDelivery(); rMoney(); rCustomers(); rOrders(); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true, 3200); }
function setMode(m){ state.mode=m; $('#mBooked').setAttribute('aria-pressed', m==='booked'); $('#mReal').setAttribute('aria-pressed', m==='real'); renderAll(); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-go],[data-drill],[data-dview],[data-sku],[data-sort],[data-fin],[data-pieces],[data-toast],.x');
  if (!t) return;
  if (t.matches('.x')) return closeDrawer();
  if (t.dataset.tab) return showTab(t.dataset.tab);
  if (t.dataset.go) { closeDrawer(); return showTab(t.dataset.go); }
  if (t.dataset.drill) return drillDrawer(t.dataset.drill, 'sku');
  if (t.dataset.dview) return drillDrawer(drillState.kind, t.dataset.dview);
  if (t.dataset.sku) return skuDrawer(t.dataset.sku);
  if (t.dataset.pieces) return piecesDrawer();
  if (t.dataset.toast) return toast(t.dataset.toast);
  if (t.dataset.fin) { state.orderFilter = t.dataset.fin; rOrders(); return; }
  if (t.dataset.sort) { const k=t.dataset.sort; state.skuSort = {k, d: state.skuSort.k===k ? -state.skuSort.d : (k==='sku'?1:-1)}; rProducts(); }
});
document.addEventListener('keydown', e => {
  if (e.key==='Escape') closeDrawer();
  if ((e.key==='Enter'||e.key===' ') && e.target.matches('.kpi[data-go]')) { e.preventDefault(); showTab(e.target.dataset.go); }
  if ((e.key==='Enter'||e.key===' ') && e.target.matches('.kpi[data-drill]')) { e.preventDefault(); drillDrawer(e.target.dataset.drill, 'sku'); }
});
document.addEventListener('input', e => { if (e.target.id==='orderQ'){ state.orderQ=e.target.value; const pos=e.target.selectionStart; rOrders(); const i=$('#orderQ'); i.focus(); i.setSelectionRange(pos,pos);} });
$('#scrim').addEventListener('click', closeDrawer);
$('#mBooked').addEventListener('click', ()=>setMode('booked'));
$('#mReal').addEventListener('click', ()=>setMode('real'));
$('#dates').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; $('#dates').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x===b)); toast(`The sample data covers the last 30 days. In the app, "${b.textContent}" reloads every number for that period.`); });
$('#grpBtn').addEventListener('click', () => setNavOpen(!navOpen));
$('#menuBtn').addEventListener('click', () => { const o = !$('#rail').classList.contains('open'); $('#rail').classList.toggle('open', o); $('#menuBtn').setAttribute('aria-expanded', o); });
document.addEventListener('click', e => { const x = e.target.closest('[data-ext]'); if (x) toast(`${x.dataset.ext} is an existing part of Traced. This mockup only covers the new Analytics section.`); });
$('#exportBtn').addEventListener('click', ()=>toast('Exports the current view as CSV for your accountant. Not wired up in the mockup.'));

/* tooltip */
const tip = $('#tip');
document.addEventListener('mouseover', e => { const t=e.target.closest('[data-tip]'); if(!t){ tip.hidden=true; return; } tip.textContent=t.dataset.tip; tip.hidden=false; });
document.addEventListener('mousemove', e => { if (tip.hidden) return; const w=tip.offsetWidth, h=tip.offsetHeight; let x=e.clientX+14, y=e.clientY+14; if (x+w>innerWidth-8) x=e.clientX-w-14; if (y+h>innerHeight-8) y=e.clientY-h-14; tip.style.left=x+'px'; tip.style.top=y+'px'; });
document.addEventListener('scroll', ()=>{ tip.hidden=true; }, true);

renderAll();
showTab((location.hash||'').slice(1) || 'overview');
</script>

</body></html>
