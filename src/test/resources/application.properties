# Disable the JobRunr background job server in tests.
# Jobs are called directly as Java methods in integration tests.
org.jobrunr.background-job-server.enabled=false

# Sentry must be disabled in tests — no DSN means no-op hub.
sentry.dsn=

# Shopify OAuth — known values for HMAC computation in integration tests.
shopify.client-id=test-client-id
shopify.client-secret=test-shopify-secret-32-bytes-abc!!
shopify.webhook-base-url=http://localhost:8080
# Fix 2.3.3 — deterministic value so tests can assert the exact admin-app redirect URL.
shopify.app-handle=test-app-handle

# Returns portal lookup token secret (PortalTokenService fails fast when missing).
portal.token-secret=test-portal-token-secret-at-least-32-bytes!!

# Global Bosta budget (2026-10-04) OFF by default in tests: a test that simulates a 429 would block
# every key for the rest of the shared Spring context. Tests of the global layer switch it on
# (BostaGlobalLimitTest, BostaRateLimiterTest's global cases construct it directly).
bosta.rate-limit.global-per-second=0

# TenantContext.runAs switching tenant inside an active transaction: fail the test (prod: warn).
tenancy.runas-switch-guard=throw
