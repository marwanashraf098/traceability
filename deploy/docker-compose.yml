services:

  # ── Spring Boot application ────────────────────────────────────────────────
  # Postgres is NOT in this stack — the app connects OUT to Supabase
  # (session-mode pooler at aws-0-eu-west-1.pooler.supabase.com:5432).
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VITE_CALENDLY_SETUP_URL: "https://calendly.com/tracedtechnology/traced-setup-call"
        # Analytics screens (build-time flag, default off). Set VITE_ANALYTICS_ENABLED=true in .env
        # (or the shell) and rebuild to turn them on.
        VITE_ANALYTICS_ENABLED: "${VITE_ANALYTICS_ENABLED:-false}"
        # Scan key capture on every scan screen (build-time flag, default off; /scan-probe always
        # captures). Set VITE_SCAN_KEY_CAPTURE=true in .env and rebuild once merchant tablets are probed.
        VITE_SCAN_KEY_CAPTURE: "${VITE_SCAN_KEY_CAPTURE:-false}"
    image: traceability-app:latest
    env_file: ../.env
    environment:
      # App logs also go to a rolling file (7 days / 500 MB cap, application.yml) on the named volume
      # below, so they survive container recreation by a deploy. Read them:
      #   docker compose -f deploy/docker-compose.yml exec app ls -l /app/logs  (host: /var/lib/docker/volumes/deploy_app_logs/_data)
      TRACED_LOG_FILE: /app/logs/traced.log
    volumes:
      - app_logs:/app/logs
    # TCP keep-alive timing for this container's network namespace (the JDBC pools set tcpKeepAlive=true):
    # first probe after 60 s idle, every 10 s, dead after 6 misses — a vanished DB peer is noticed in ~2 min
    # instead of the kernel default 2 h 11 min.
    sysctls:
      net.ipv4.tcp_keepalive_time: 60
      net.ipv4.tcp_keepalive_intvl: 10
      net.ipv4.tcp_keepalive_probes: 6
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    networks:
      - internal
    # Port NOT published to host — nginx is the only ingress.

  # ── Nginx TLS-terminating reverse proxy ───────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Nginx config
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Let's Encrypt certs issued by certbot on the HOST before first compose up.
      # See ../docs/DEPLOY-NOTES.md for the certbot command.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Certbot HTTP-01 challenge webroot
      - /var/www/certbot:/var/www/certbot:ro
      # tracedtech.com marketing site — static files only, served directly by
      # nginx (root /usr/share/nginx/marketing in nginx.conf). Decoupled from
      # the app service: no build step, no container, just this bind mount.
      - ../marketing:/usr/share/nginx/marketing:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  app_logs:
