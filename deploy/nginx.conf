###############################################################################
# nginx.conf — Traced production reverse proxy
#
# Role: TLS termination + reverse proxy to the Spring Boot app container, plus the
# static tracedtech.com marketing site and the returns.tracedtech.com customer portal.
#
# No CDN/proxy in front: DNS (GoDaddy) points straight at this host, so clients connect
# to nginx directly and $remote_addr is the real client IP.
#
# Certificates: Let's Encrypt via the host's system certbot, --webroot /var/www/certbot
# (served by the port-80 ACME locations below), renewed by certbot.timer with a deploy
# hook that reloads nginx. See docs/DEPLOY-NOTES.md.
#   /etc/letsencrypt/live/app.tracedtech.com/     — app.tracedtech.com
#   /etc/letsencrypt/live/tracedtech.com/         — tracedtech.com + www.tracedtech.com
#   /etc/letsencrypt/live/returns.tracedtech.com/ — returns.tracedtech.com
###############################################################################

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $request_id [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" cf_ray=$http_cf_ray';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
    # Do NOT gzip application/pdf or application/octet-stream — already binary-compressed.

    # ── Body size ─────────────────────────────────────────────────────────────
    # AWB PDFs arrive as base64 (~55 KB per label), Shopify webhooks are a few KB.
    # 10 MB is generous and safe; raise only if bulk-AWB batch endpoints are added.
    client_max_body_size 10m;

    # ── Cloudflare real-IP (inert today) ──────────────────────────────────────
    # Cloudflare is NOT in front of this host. These directives only rewrite
    # $remote_addr when the TCP peer is inside a Cloudflare range, so for ordinary
    # visitors they do nothing and $remote_addr stays the real peer address. Kept
    # (not removed) pending a separate decision; if Cloudflare is ever put in front,
    # refresh the ranges from https://www.cloudflare.com/ips/.
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    # CF-Connecting-IP contains the real visitor IP when Cloudflare is the proxy.
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # ── Rate-limiting zones ───────────────────────────────────────────────────
    # Applied to /api/ only. Static assets are excluded by a dedicated location
    # block so the browser's parallel asset-load burst never trips this limit.
    # $binary_remote_addr is the real client IP (direct connections — see the header).
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    # Public returns portal (/api/v1/portal/**, unauthenticated): 30 requests/minute per
    # client IP, burst 15 — generous because customers on mobile data often share one
    # carrier IP. The app additionally throttles per order number (5 failures / 60 min).
    limit_req_zone $binary_remote_addr zone=portal:10m rate=30r/m;

    # ── Upstream ─────────────────────────────────────────────────────────────
    upstream app {
        server app:8080;
        keepalive 32;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name app.tracedtech.com;

        # Certbot HTTP-01 challenge — must stay on port 80
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS main server ─────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name app.tracedtech.com;

        # ── TLS ───────────────────────────────────────────────────────────────
        ssl_certificate     /etc/letsencrypt/live/app.tracedtech.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.tracedtech.com/privkey.pem;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_stapling        on;
        ssl_stapling_verify on;

        # ── Security headers ─────────────────────────────────────────────────
        # HSTS: 1-year, include subdomains, preload-ready.
        # Do not add preload until you are sure ALL subdomains are HTTPS.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # CSP is intentionally permissive here — tighten per your SPA's needs.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://cdn.shopify.com; connect-src 'self';" always;

        # ── Favicon ──────────────────────────────────────────────────────────
        # Vite produces an SVG logo; no favicon.ico file is served by the app.
        # Return empty 204 to silence the browser's automatic /favicon.ico probe
        # (was returning 500 — Spring's error dispatcher, no matching handler).
        location = /favicon.ico {
            return 204;
            access_log off;
        }

        # ── Root path — Shopify embedded app entry point ──────────────────────
        # Shopify loads the embedded app at https://app.tracedtech.com/?shop=...&host=...
        # SpaController.root() forwards to embedded.html (no redirect — App Bridge CDN
        # reads window.location.pathname on init and sends it to the parent admin frame;
        # staying at / means the admin URL stays ...apps/{handle} with no extra path segment).
        # location = / overrides the server-level X-Frame-Options: DENY because it defines
        # its own add_header block; proxy_hide_header strips the upstream Spring Security DENY.
        # frame-ancestors allows Shopify admin to iframe / while blocking all other origins.
        # Without params, root forwards to index.html (standalone landing page) — those
        # requests are also safe to allow framing from Shopify admin since the same CSP applies.
        location = / {
            proxy_hide_header  X-Frame-Options;

            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "frame-ancestors https://admin.shopify.com https://*.myshopify.com;" always;

            proxy_pass         http://app;
            proxy_http_version 1.1;
            proxy_set_header   Connection          "";
            proxy_set_header   Host                $host;
            proxy_set_header   X-Real-IP           $remote_addr;
            proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto   $scheme;
            proxy_set_header   X-Forwarded-Host    $host;
            proxy_set_header   X-Request-Id        $request_id;
            proxy_set_header   CF-Connecting-IP    $http_cf_connecting_ip;
            proxy_set_header   CF-Ray              $http_cf_ray;
            proxy_connect_timeout  10s;
            proxy_send_timeout     30s;
            proxy_read_timeout     30s;
            proxy_buffering on;
            proxy_buffer_size    16k;
            proxy_buffers        8 16k;
        }

        # ── Embedded Shopify App Bridge shell ─────────────────────────────────
        # /embedded and /embedded.html are loaded inside the Shopify admin iframe.
        # They MUST NOT carry X-Frame-Options: DENY (which the server block sets).
        # Because this location defines its own add_header directives, the server-
        # level add_header directives (including DENY) are NOT inherited here.
        # Spring Security also adds X-Frame-Options: DENY from the upstream —
        # proxy_hide_header strips that before it reaches the browser.
        # The frame-ancestors CSP is the authoritative framing policy; it restricts
        # framing to Shopify admin only (no X-Frame-Options means frameable by all
        # origins without the CSP, so the CSP is REQUIRED here).
        location ^~ /embedded {
            proxy_hide_header  X-Frame-Options;

            # Re-add security headers (not inherited because this block has add_header).
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            # Allow Shopify admin to iframe this path; deny all other origins.
            add_header Content-Security-Policy "frame-ancestors https://admin.shopify.com https://*.myshopify.com;" always;

            proxy_pass         http://app;
            proxy_http_version 1.1;
            proxy_set_header   Connection          "";
            proxy_set_header   Host                $host;
            proxy_set_header   X-Real-IP           $remote_addr;
            proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto   $scheme;
            proxy_set_header   X-Forwarded-Host    $host;
            proxy_set_header   X-Request-Id        $request_id;
            proxy_set_header   CF-Connecting-IP    $http_cf_connecting_ip;
            proxy_set_header   CF-Ray              $http_cf_ray;
            proxy_connect_timeout  10s;
            proxy_send_timeout     30s;
            proxy_read_timeout     30s;
            proxy_buffering on;
            proxy_buffer_size    16k;
            proxy_buffers        8 16k;
        }

        # ── Static assets (Vite build output) ─────────────────────────────
        # ROOT CAUSE OF BLANK PAGE: Vite's production HTML adds the `crossorigin`
        # attribute to every <script type="module"> and <link rel="stylesheet">.
        # This causes the browser to send Origin: https://app.tracedtech.com on
        # every asset fetch, even though page and assets share the same host.
        # Spring Security's CorsFilter checks the Origin against the configured
        # allowedOriginPatterns. In production those patterns only cover localhost
        # and an unresolved "${CORS_ALLOWED_ORIGINS:}" literal — so the check fails
        # and the filter returns 403 with an empty body (no Content-Type).
        # The browser sees an empty MIME type and refuses to apply the stylesheet.
        # A single `curl -I` does not send Origin, bypasses the CORS filter, and
        # returns 200 — which is why the curl test succeeded but the browser didn't.
        #
        # FIX: strip the Origin header before proxying asset requests. With no
        # Origin present the CorsFilter is a no-op; Spring's permitAll() for
        # /assets/** takes over and the static resource handler serves 200+type.
        # No rate limiting here — assets must survive the browser's parallel burst.
        location /assets/ {
            proxy_pass         http://app;
            proxy_http_version 1.1;
            proxy_set_header   Connection          "";
            proxy_set_header   Host                $host;
            proxy_set_header   X-Real-IP           $remote_addr;
            proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto   $scheme;
            proxy_set_header   X-Request-Id        $request_id;
            proxy_set_header   CF-Connecting-IP    $http_cf_connecting_ip;
            proxy_set_header   CF-Ray              $http_cf_ray;
            # Strip Origin — static assets require no CORS negotiation.
            proxy_set_header   Origin              "";

            proxy_buffering on;
            proxy_buffer_size    16k;
            proxy_buffers        8 16k;
        }

        # ── Public returns portal (strict rate limit) ──────────────────────
        # ^~ wins over the generic /api/ block below. No add_header here, so every
        # server-level security header (HSTS, X-Frame-Options DENY, nosniff,
        # Referrer-Policy, CSP) is inherited unchanged. Proxying mirrors /api/.
        location ^~ /api/v1/portal/ {
            limit_req        zone=portal burst=15 nodelay;
            limit_req_status 429;
            # nginx's own 429 as JSON, same body as the app's per-order throttle. Only
            # nginx-generated 429s hit this (proxy_intercept_errors is off, so the app's
            # own responses pass through untouched).
            error_page       429 = @portal_429;

            proxy_pass         http://app;
            proxy_http_version 1.1;
            proxy_set_header   Connection          "";
            proxy_set_header   Host                $host;
            proxy_set_header   X-Real-IP           $remote_addr;
            proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto   $scheme;
            proxy_set_header   X-Forwarded-Host    $host;
            proxy_set_header   X-Request-Id        $request_id;
            proxy_set_header   CF-Connecting-IP    $http_cf_connecting_ip;
            proxy_set_header   CF-Ray              $http_cf_ray;
            proxy_set_header   Origin              "";

            proxy_connect_timeout  10s;
            proxy_send_timeout     60s;
            proxy_read_timeout     60s;

            proxy_buffering on;
            proxy_buffer_size    16k;
            proxy_buffers        8 16k;
        }

        location @portal_429 {
            default_type application/json;
            return 429 '{"message":"Too many attempts. Please try again later."}';
        }

        # ── API (rate-limited) ─────────────────────────────────────────────
        # 20 r/s sustained, 30-request burst served immediately (nodelay).
        # Returns 429 (not nginx's default 503) for requests above the limit.
        # Does NOT cover /assets/ or webhook paths — those use other blocks.
        location /api/ {
            limit_req        zone=api burst=30 nodelay;
            limit_req_status 429;

            proxy_pass         http://app;
            proxy_http_version 1.1;
            proxy_set_header   Connection          "";
            proxy_set_header   Host                $host;
            proxy_set_header   X-Real-IP           $remote_addr;
            proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto   $scheme;
            proxy_set_header   X-Forwarded-Host    $host;
            proxy_set_header   X-Request-Id        $request_id;
            proxy_set_header   CF-Connecting-IP    $http_cf_connecting_ip;
            proxy_set_header   CF-Ray              $http_cf_ray;
            # Strip Origin — SPA calls /api/ same-origin; Spring's broken CORS
            # allow-list rejects the browser's Origin header with 403.
            # Webhooks (Shopify/Bosta) don't send Origin, so this is a no-op for them.
            proxy_set_header   Origin              "";

            proxy_connect_timeout  10s;
            proxy_send_timeout     60s;
            proxy_read_timeout     60s;

            proxy_buffering on;
            proxy_buffer_size    16k;
            proxy_buffers        8 16k;
        }

        # ── Proxy to Spring Boot app ─────────────────────────────────────────
        location / {
            proxy_pass         http://app;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            # Standard forwarded headers — app uses these for URL generation + audit logs.
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;

            # Preserve or generate the correlation ID.
            # CorrelationIdFilter in the app will accept this if present, or generate one.
            proxy_set_header   X-Request-Id      $request_id;

            # Pass Cloudflare ray ID through for joint log correlation.
            proxy_set_header   CF-Connecting-IP  $http_cf_connecting_ip;
            proxy_set_header   CF-Ray            $http_cf_ray;

            # Timeouts: generous for label/PDF generation and Shopify/Bosta API calls.
            proxy_connect_timeout  10s;
            proxy_send_timeout     60s;
            proxy_read_timeout     60s;

            proxy_buffering on;
            proxy_buffer_size    16k;
            proxy_buffers        8 16k;
        }

        # ── Webhook endpoints — explicit note ────────────────────────────────
        # POST /api/v1/webhooks/bosta   → matched by location /api/ above (rate-limited; fine).
        # POST /webhooks/shopify/**     → matched by location / catch-all (no rate limit).
        # Both pass through with the 10m body-size limit and 60s timeouts.
        # If Shopify ever sends bodies > 10m (bulk data export), raise client_max_body_size.

        # ── Health endpoint — accessible for load-balancer probes ────────────
        location /actuator/health {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            access_log off;
        }
    }

    # ═══════════════════════════════════════════════════════════════════════
    # tracedtech.com — marketing site (static, decoupled from the app)
    #
    # apex is canonical; www redirects to apex. No proxy_pass/upstream here —
    # nginx serves marketing/index.html directly from a read-only bind mount
    # (see deploy/docker-compose.yml, nginx service).
    #
    # Brought up in two stages (2026-09): first the port-80 blocks (ACME webroot +
    # redirect, no certificate dependency), then — after certbot had issued the
    # tracedtech.com certificate — the port-443 blocks. Both stages are live now.
    #
    # Rule for any new host: a server block whose ssl_certificate path does not exist
    # yet must NOT be in this file — `nginx -t` fails hard on a missing certificate,
    # and nginx validates the WHOLE file, so it would take down every other host too.
    # ═══════════════════════════════════════════════════════════════════════

    # ── HTTP — apex: ACME challenge + upgrade to https ────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name tracedtech.com;

        # Certbot HTTP-01 challenge — must stay on port 80
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTP — www: ACME challenge + redirect straight to the apex ────────────
    # (certbot's HTTP-01 check for the www SAN hits this vhost, so it needs its
    # own challenge location even though it never serves real traffic.)
    server {
        listen 80;
        listen [::]:80;
        server_name www.tracedtech.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://tracedtech.com$request_uri;
        }
    }

    # ── HTTPS — apex: static marketing site ────────────────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name tracedtech.com;

        # ── TLS ───────────────────────────────────────────────────────────────
        ssl_certificate     /etc/letsencrypt/live/tracedtech.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tracedtech.com/privkey.pem;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_stapling        on;
        ssl_stapling_verify on;

        # ── Security headers ─────────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Own CSP — nothing is inherited from the app.tracedtech.com server
        # block above; each server{} in nginx is independent. script-src has
        # no 'unsafe-inline': every script on the page is an external
        # same-origin file under marketing/assets/landing/. font-src needs
        # 'self' alongside fonts.gstatic.com because the Geist woff2 files
        # are self-hosted under marketing/assets/landing/ too — Google Fonts
        # is only ever preconnected to, never actually loaded from.
        # style-src keeps 'unsafe-inline' for the mockup's inline <style>
        # blocks in <head>. img-src allows data: for the embedded base64 logos.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none';" always;

        # ── Static site — no proxy_pass, no upstream ───────────────────────────
        root /usr/share/nginx/marketing;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ── HTTPS — www: redirect to apex ──────────────────────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name www.tracedtech.com;

        # Same cert covers both names — issued as:
        #   certbot certonly --webroot -w /var/www/certbot -d tracedtech.com -d www.tracedtech.com
        ssl_certificate     /etc/letsencrypt/live/tracedtech.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tracedtech.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        return 301 https://tracedtech.com$request_uri;
    }

    # ═══════════════════════════════════════════════════════════════════════
    # returns.tracedtech.com — customer returns portal (Step 4e-B)
    #
    # Port 80 only in this commit: the ACME webroot + a redirect to https, no
    # certificate dependency, so it is safe to deploy before the certificate exists.
    # The port-443 block is added in a separate commit, deployed only after
    #   certbot certonly --webroot -w /var/www/certbot -d returns.tracedtech.com
    # has issued /etc/letsencrypt/live/returns.tracedtech.com/. See docs/DEPLOY-NOTES.md.
    # ═══════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        listen [::]:80;
        server_name returns.tracedtech.com;

        # Certbot HTTP-01 challenge — must stay on port 80
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS — returns.tracedtech.com: customer returns portal ─────────────────
    # Serves only: the portal page (/ and /{slug} → the app's /portal.html), its
    # /assets/, and the public /api/v1/portal/** API. Every other path is 404 on this
    # host — no /api/v1/auth, no other /api, no /actuator, no webhooks.
    # Requires /etc/letsencrypt/live/returns.tracedtech.com/ (issued by certbot
    # --webroot via the port-80 block above) BEFORE this block is deployed.
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name returns.tracedtech.com;

        # ── TLS (same settings as app.tracedtech.com) ─────────────────────────
        ssl_certificate     /etc/letsencrypt/live/returns.tracedtech.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/returns.tracedtech.com/privkey.pem;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_stapling        on;
        ssl_stapling_verify on;

        # ── Security headers ─────────────────────────────────────────────────
        # No location below has its own add_header, so all of these apply everywhere.
        # CSP: no inline scripts (Vite emits external modules only); style-src keeps
        # 'unsafe-inline' for React style attributes (brand colour variables); images
        # from Shopify's CDN (product images, the merchant's logo); fonts self-hosted.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.shopify.com; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self';" always;
        # The app also sends X-Frame-Options (Spring Security); keep one copy.
        proxy_hide_header  X-Frame-Options;

        # ── Forwarded headers — this host overwrites, never appends ───────────
        # Clients connect directly (no CDN), so $remote_addr is the real client IP.
        # A client-sent X-Forwarded-For / Forwarded / CF-Connecting-IP is dropped so
        # Spring (forward-headers-strategy: framework) can't be handed a spoofed address.
        proxy_http_version 1.1;
        proxy_set_header   Connection          "";
        proxy_set_header   Host                $host;
        proxy_set_header   X-Real-IP           $remote_addr;
        proxy_set_header   X-Forwarded-For     $remote_addr;
        proxy_set_header   X-Forwarded-Proto   https;
        proxy_set_header   X-Forwarded-Host    $host;
        proxy_set_header   X-Request-Id        $request_id;
        proxy_set_header   Forwarded           "";
        proxy_set_header   CF-Connecting-IP    "";
        # Same-origin calls only; Spring's CORS allow-list would reject the Origin header.
        proxy_set_header   Origin              "";
        proxy_buffering on;
        proxy_buffer_size    16k;
        proxy_buffers        8 16k;

        # ── Portal bundle assets ──────────────────────────────────────────────
        location ^~ /assets/ {
            proxy_pass http://app;
        }

        # ── Public portal API (same zone and JSON 429 as on app.tracedtech.com) ─
        location ^~ /api/v1/portal/ {
            limit_req        zone=portal burst=15 nodelay;
            limit_req_status 429;
            error_page       429 = @portal_429;

            proxy_connect_timeout  10s;
            proxy_send_timeout     60s;
            proxy_read_timeout     60s;
            proxy_pass http://app;
        }

        location @portal_429 {
            default_type application/json;
            return 429 '{"message":"Too many attempts. Please try again later."}';
        }

        # ── Portal page: / and /{slug} → the app's /portal.html ──────────────
        location = / {
            rewrite ^ /portal.html break;
            proxy_pass http://app;
        }

        location ~ "^/[a-z0-9-]{3,40}/?$" {
            rewrite ^ /portal.html break;
            proxy_pass http://app;
        }

        # ── Everything else ───────────────────────────────────────────────────
        location / {
            return 404;
        }
    }
}
